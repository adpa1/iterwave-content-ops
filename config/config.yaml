# ============================================================
# IterWave — 主配置文件
# 唯一可修改的配置源，所有模块从此读取
# 时间统一本地时区（R5），严禁 datetime.utcnow()
# ============================================================

# ===== 基础路径 =====
paths:
  data_dir: "data"                          # SQLite + 运行时输出根目录
  db_file: "data/easel.db"                  # SQLite 文件
  backup_dir: "backups"                     # 迁移备份目录
  output_dir: "data/outputs"                # 图片卡片 / 生图输出
  screenshot_dir: "data/screenshots"        # Playwright 截图（R23 保留 30 天）
  log_dir: "data/logs"                      # 日志目录

# ===== 选题库配置（§16.1）=====
# 三种来源可在页面「内容资产 → 选题库来源」管理：
#   上传文件 / 远程地址（CSV/JSON/RSS，每天同步）/ 服务器路径
# 默认使用数据目录下的空库（首次启动自动创建），不接选题库也能跑
# 相对路径相对「数据目录」，也可以写绝对路径
topic_kb:
  path: "kb/topics.csv"
  type: "auto"                              # auto / csv / json / jsonl / xlsx / sqlite
  table_name: "items"                       # SQLite 读哪张表（留空自动选行数最多的）
  default_dimension: "综合"                 # 没有维度列时归到这个维度
  field_mapping:                            # 通用字段 → 原始列名（留空 = 自动识别中英文列名）
    source: "source"
    title: "title"
    summary: "summary"
    link: "link"
    date: "date"
    dimension: "dimension"

# ===== 图片卡片渲染 =====
render:
  # 中文字体路径；留空自动匹配（macOS / Linux / Windows 常见字体）
  font_path: ""
  card_tag_fallback: "今日分享"

# ===== 四平台运营计划 =====
# enabled=false 的平台本轮完全跳过（存草稿/拉数据/运营都不跑）
platforms:
  xhs:
    enabled: true
    name: "小红书"
    base_url: "https://creator.xiaohongshu.com"
    # 账号标识（登录态 key，login_state.py 用）
    account_key: "xhs_main"
  douyin:
    enabled: true
    name: "抖音"
    base_url: "https://creator.douyin.com"
    account_key: "douyin_main"
  kuaishou:
    enabled: false
    name: "快手"
    base_url: "https://creator.kuaishou.com"
    account_key: "kuaishou_main"
  wechat_channels:
    enabled: true
    name: "视频号"
    base_url: "https://channels.weixin.qq.com"
    account_key: "wechat_main"

# ===== 评分权重（§15 三模式，权重和必须 = 100%）=====
# 系统按已发布样本量自动切换模式，这里只定义各模式权重
scoring:
  cold_start:                    # 全库已发布样本 < 10
    position_match: 40
    history_performance: 0        # 冷启动无历史
    timeliness: 30
    gap_weight: 0                # 冷启动无缺口
    freshness: 30
  sample_accumulating:           # ≥ 10 且有维度样本 < 5
    position_match: 35
    history_performance: 10
    timeliness: 25
    gap_weight: 10
    freshness: 20
  stable_operation:              # 所有活跃维度 ≥ 5
    position_match: 30
    history_performance: 25
    timeliness: 20
    gap_weight: 15
    freshness: 10
  # 时效窗口
  timeliness_half_life_days:
    news: 7                      # 时事类 half-life 7 天
    evergreen: 365               # 常青知识类 half-life 365 天（近似不衰减）
  # 活跃维度判定
  active_dimension_min_uses: 2   # 90 天内至少出现多少次才算活跃维度
  active_dimension_window_days: 90
  # 收缩估计参数（样本积累模式用）
  shrinkage_m: 5
  normalization_window_days: 90
  cold_start_min_published: 10
  stable_dimension_min_samples: 5
  history_normalization_scale: 2000
  freshness_window_days: 30
  dimension_gap_ratio: 0.5
  dimension_gap_score: 90
  dimension_normal_score: 40
  no_persona_match_score: 60
  stable_exploration_percent: 15
  timeliness_unknown_score: 50
  history_cold_start_score: 0
  freshness_recent_use_penalty: 20
  freshness_min_score: 10
  freshness_unused_score: 100

# ===== 终极目标画像（§12.3 UltimateGoalChecker）=====
ultimate_goal:
  # 首次安装不预设账号定位；用户保存自己的定位关键词后才启用匹配。
  # 输入框中的示例仅作为填写提示，不参与评分、研判或内容检查。
  persona_keywords: []
  # 红线关键词（出现即丢弃重生成，G2 红线分支）
  redline_keywords:
    - "赌博"
    - "色情"
    - "暴力"
    - "毒品"
  # 禁止的主题方向
  forbidden_directions:
    - "单纯追热点无沉淀"
    - "与账号定位无关的娱乐八卦"

# ===== 超时参数表（§14.3，唯一权威定义，严禁用一个超时覆盖多阶段）=====
timeouts:
  round_timeout_hours: 48                        # 仅 producing 阶段
  awaiting_publish_timeout_hours: 120            # 仅 awaiting_publish 阶段
  publish_confirm_timeout_hours: 72              # per-draft 单篇
  publish_confirm_grace_hours: 48               # per-draft 单篇
  collecting_metrics_timeout_hours: 72            # 仅 collecting_metrics 阶段
  metrics_initial_delay_hours: 24                # user_published 后等拉数据
  metrics_retry_attempts: 3                    # 数据采集失败最大尝试次数
  metrics_retry_interval_minutes: 30            # 数据采集失败重试间隔
  login_timeout_seconds: 240                     # 平台扫码登录等待上限
  login_export_timeout_seconds: 90               # 登录态导出超时
  recovery_retry_delay_minutes: 1                # 服务重启后补登记采集任务的延迟
  goal_max_rounds: 30                            # 一个目标最大轮数
  round_min_interval_hours: 4                    # 两轮最短间隔

# ===== 熔断机制（§5 停止所有运营）=====
circuit_breaker:
  # 触发信号由适配器事件与 CircuitBreakerReason 枚举定义，不通过配置关闭或增删。
  # 默认冷却时间（分钟）
  cooldown_minutes: 30
  recovery_failure_extension_minutes: 60

# ===== 节奏控制器 =====
rhythm:
  # 平台独立配额（每日上限，0=该平台该动作禁用）
  daily_quotas:
    xhs:
      passive_replies: 50
      active_comments: 10
      follows: 5
    douyin:
      passive_replies: 50
      active_comments: 10
      follows: 5
    kuaishou:
      passive_replies: 30
      active_comments: 5
      follows: 3
    wechat_channels:
      passive_replies: 20
      active_comments: 5
      follows: 3
  # 时段窗口（本地时区，R5）
  windows:
    # 运营动作的允许时段（避开深夜）
    ops:
      start_hour: 8
      end_hour: 23
    # 存草稿时段
    draft_save:
      start_hour: 9
      end_hour: 22
  # 随机间隔（秒，在基准间隔 ± 范围内随机）
  intervals:
    passive_reply_base_seconds: 60
    passive_reply_jitter_seconds: 30
    active_comment_base_seconds: 300
    active_comment_jitter_seconds: 120
    follow_base_seconds: 600
    follow_jitter_seconds: 300

# ===== 主动运营目标清单（G-03）=====
# daily_ops 每天 8:00 按此清单 + daily_quotas 派发 task_runs。
# 目标必须由用户人工指定：空白 = 该平台不派发任何主动动作（不做自动搜索发现）。
# 主动评论 content 必须通过终极目标检查（红线/联系方式），未通过则 task_run 记 skipped。
ops_targets:
  xhs:
    active_comments: []        # [{url: "https://...", content: "真实观点评论"}]
    follows: []                # ["用户主页 URL 或 user_id"]
  douyin:
    active_comments: []
    follows: []
  kuaishou:
    active_comments: []
    follows: []
  wechat_channels:
    active_comments: []
    follows: []

# ===== 消息通知 =====
notifications:
  channels:
    # macOS 原生通知（terminal-notifier）
    # 本地服务常驻运行时全部静音：只写 notifications 表（通知中心可查），不弹系统横幅
    macos:
      enabled: false
    # 企业微信 webhook
    wecom:
      enabled: false
      webhook_url_env: "WECOM_WEBHOOK_URL"    # 从 .env 读取（R23）
    # 飞书 webhook
    feishu:
      enabled: false
      webhook_url_env: "FEISHU_WEBHOOK_URL"   # 从 .env 读取（R23）
  # 7 种通知场景 × 4 级
  events:
    - name: "draft_saved"
      level: "info"
      enabled: true
    - name: "draft_failed"
      level: "error"
      enabled: true
    - name: "circuit_broken"
      level: "critical"
      enabled: true
    - name: "login_expired"
      level: "critical"
      enabled: true
    - name: "goal_completed"
      level: "info"
      enabled: true
    - name: "data_fetch_failed"
      level: "warning"
      enabled: true
    - name: "round_completed"
      level: "info"
      enabled: true
    - name: "circuit_recovered"
      level: "info"
      enabled: true
    - name: "publish_confirmed"
      level: "info"
      enabled: true
    - name: "quota_exhausted"
      level: "info"
      enabled: true
    - name: "round_timeout"
      level: "warning"
      enabled: true

# ===== 热点数据源（R22，默认公益 API）=====
hot_topics:
  enabled: true
  # 采集频率见下方 scheduler.jobs.hot_topics_refresh
  # 保留与去重：同平台同标题只更新、不新增；跨平台同一事件合并展示；
  # 滚动：每次采集只保留当前榜单（本轮没再上榜的旧热点立即删除，不展示也不参与研判）
  retention_days: 7               # 兜底清理：last_seen_at 早于 N 天的残留行删除（采集失败占位等）
  max_rows: 5000                  # hot_topics 总行数硬上限（超出从最旧的删）
  max_items_per_source: 30
  fetch_timeout_seconds: 15
  max_concurrent_fetches: 8
  trend_burst_multiplier: 1.5
  trend_cooled_ratio: 0.6
  trend_sustained_ratio: 0.9
  trend_previous_drop_ratio: 0.9
  trend_min_seen_count: 3
  dedup:
    cross_platform_similarity: 0.8   # 跨平台标题相似度阈值（字符二元组 Jaccard，0.5–1.0）
    cross_platform_window_hours: 48  # 只在该时间窗内找跨平台重复
  sources:
    # 综合热榜（可整条去掉或 enabled: false）
    - name: "60s.viki.moe"
      type: "aggregate"                 # aggregate / rss / json
      url: "https://60s.viki.moe"
      platforms: ["weibo", "douyin", "zhihu", "toutiao", "bilibili"]
    # 行业源示例（RSS / 自定义 JSON，可在「热点雷达」页面里增删）：
    # - name: "行业媒体"
    #   type: "rss"                     # rss / json
    #   platform: "行业"                 # 展示用的平台/来源名
    #   url: "https://example.com/feed.xml"
    #   enabled: true
    #   headers: { Authorization: "Bearer <token>" }
  # 4 门筛选（后 2 门不可关闭，R22）
  filters:
    heat_threshold: 5000          # 🔥 热度门槛（可关）
    heat_filter_enabled: true
    time_window_hours: 48         # ⏰ 时效门槛（可关）
    time_filter_enabled: true
    dimension_match_required: true  # 🎯 维度匹配（不可关）
    publishability_required: true   # ✅ 可发布性（不可关）

# ===== 文案生成 LLM（Agent Plan / 方舟）=====
# R23：API Key 只放 .env 的 ARK_API_KEY，禁止写进本文件/日志/前端
# enabled=false 或 .env 无 key → 自动降级为模板文案（不伪装成 AI 生成）
llm:
  enabled: false
  provider: "ark"
  # ⚠️ 通道选择（「系统设置 → 主模型与备用」可直接选，无需手改本文件）：
  #   /api/v3      → 按量付费通道
  #   /api/plan/v3 → 专属 Agent Plan 通道（Agent Plan 只支持套餐内模型，
  #                  e.g. doubao-seed-2.1-lite / doubao-seed-2.0-mini / deepseek-v4.1-flash-economy）
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  model: "doubao-seed-2.1-lite"
  fallback_model: "doubao-seed-2.0-mini"   # 主模型失败时兜底；空 = 不启用（可在「系统设置」在线改）
  api_key_env: "ARK_API_KEY"
  temperature: 0.7
  timeout_seconds: 60

# ===== 数据保留清理（R23，APScheduler 第 7 类任务，每天 6:00）=====
data_retention:
  raw_response_days: 90          # 平台原始响应保留
  screenshot_days: 30             # 截图保留
  ops_logs_days: 365              # 运营日志保留
  ai_calls_detail_days: 180       # AI 调用明细保留（聚合统计永久）

# ===== 定时任务（APScheduler，本地时区 R5）=====
# 默认触发规则以 src/core/config.py DEFAULT_JOB_SCHEDULES 为唯一代码默认源；
# 运行时调整写入账号组 SQLite，避免 YAML 与 Python 双重维护。
scheduler: {}

# ===== 自动闭环（自生长）=====
# 复盘结论 → 下一轮选题加减分 + 文案要点；满足条件时自动开下一轮并生成草稿。
# 发布仍需你在平台确认；目标达成 / 连续失败 / 每日上限 / 冷却期 / 全平台熔断任一命中都不开轮。
autogrow:
  enabled: true
  apply_feedback: true
  topic_count: 5
  cooldown_hours: 24
  max_rounds_per_day: 1
  max_consecutive_failures: 2
  stop_when_goals_achieved: true
  feedback_max_bias: 15
  feedback_lookback_rounds: 3
  recency_decay: 0.5
  full_confidence_samples: 5
  coverage_gap_bias_ratio: 0.6
  validation_gap_bias_ratio: 0.3
  min_dimension_bias: 0.5
  max_reference_titles_per_platform: 2
  max_copy_hints_per_platform: 6
  max_copy_hint_chars: 120

copy_generation:
  topic_summary_max_chars: 300
  title_max_chars: 20
  body_min_chars: 150
  body_max_chars: 400
  tag_min_count: 3
  tag_max_count: 5
  persona_keyword_limit: 8
  forbidden_direction_limit: 5
  strategy_hint_max_count: 6
  strategy_hint_max_chars: 120
  max_guard_retries: 2

insights:
  window_days: 90
  cache_max_age_minutes: 60
  top_dimensions_limit: 5
  top_hours_limit: 3

plan_suggestion:
  default_topic_count: 5
  default_period_days: 28
  minimum_sample_count: 3
  max_topics_per_platform: 50
  max_rounds: 60
  default_interval_days: 7

spiral:
  min_dimension_samples: 5
  validation_gap_topic_min: 2
  validation_gap_topic_max: 3
  coverage_gap_ratio: 0.5
  coverage_performance_multiplier: 1.5
  min_suggested_add: 50
  min_platform_samples: 3
  low_interaction_rate_threshold: 0.02
  min_metrics_for_ops_adjustment: 3
  min_rounds_for_systematic_adjustment: 5


# ===== 运行时策略参数（硬安全上限仍由代码强制）=====
vision_ranking:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  timeout_seconds: 25
  candidate_limit: 8
  max_image_bytes: 4194304
  max_body_chars: 1800
  temperature: 0
  max_tokens: 600

media_generation:
  base_url: "https://api.openai.com/v1"
  timeout_seconds: 150
  connect_timeout_seconds: 15
  max_response_bytes: 20971520
  max_dimension: 20000
  max_pixels: 40000000

media_quality:
  resolution_weight: 25
  composition_weight: 20
  contrast_weight: 20
  brightness_weight: 15
  sharpness_weight: 20
  color_diversity_weight: 20
  resolution_reference_pixels: 1500000
  portrait_ratio_min: 0.55
  portrait_ratio_max: 0.85
  square_ratio_max: 1.1
  landscape_ratio_max: 1.7
  brightness_min: 45
  brightness_max: 210
  brightness_penalty_scale: 8.5
  contrast_reference: 45
  sharpness_reference: 500
  sharpness_warning_threshold: 35
  low_contrast_threshold: 18
  low_resolution_pixels: 500000
  low_color_count: 3
  color_count_reference: 16
  composition_near_square_multiplier: 0.85
  composition_wide_multiplier: 0.6
  composition_extreme_multiplier: 0.25
  sharpness_fallback_contrast_reference: 60
  sampling_size: 512
  color_quantization_colors: 16

tenant_switch:
  request_drain_timeout_seconds: 30
  scheduler_drain_timeout_seconds: 30
  round_drain_timeout_seconds: 120
  background_jobs_timeout_seconds: 120
  login_process_timeout_seconds: 10

tenant_backup:
  max_bytes: 2147483648
  retention_count: 10

hot_topic_matcher:
  match_threshold: 60
  llm_temperature: 0.1
  keyword_score: 60
  batch_size: 20
  max_per_run: 200
